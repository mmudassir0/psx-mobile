# Reads each KSE-100 and KMI-30 company's latest report from PSX, extracts its balance
# sheet, verifies it, and stores the result in assets/fundamentals.json on the
# `data` branch. When anything changed, it starts a new APK build so the app
# ships with the fresh numbers. Companies whose report hasn't changed are
# skipped, so a run after the results season costs almost nothing.
name: Fundamentals
on:
  schedule:
    - cron: '17 1 * * *'   # daily 06:17 PKT; unchanged reports are skipped in seconds
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated symbols (blank = all KSE-100 and KMI-30)'
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: fundamentals
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Guard against tampered code
        run: node scripts/guard.js
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
      - name: Previous data
        run: |
          mkdir -p /tmp/data
          if git fetch -q origin data 2>/dev/null; then
            git show origin/data:fundamentals.json > /tmp/data/fundamentals.json 2>/dev/null || true
          fi
      - name: Find reports
        env:
          ONLY: ${{ inputs.only }}
        run: |
          # The input arrives as data, never as part of the script; split it on commas and spaces.
          IFS=', ' read -r -a SYMS <<< "$ONLY"
          npx tsx scripts/fundamentals/find-reports.ts "${SYMS[@]}" > /tmp/data/reports.json
      - name: Extract and verify
        timeout-minutes: 240
        env:
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY$GEMINI_API_KEY" ]; then echo "::error::Add the GEMINI_API_KEY or GROQ_API_KEY repository secret"; exit 1; fi
          python3 scripts/fundamentals/extract.py /tmp/data/reports.json /tmp/data/fundamentals.json --budget-min 200 | tee /tmp/data/log.txt
      - name: Publish to the data branch
        id: publish
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/data/fundamentals.json'))
          print(f"{len(d['companies'])} companies ok, {len(d['failures'])} failed")
          PY
          cp /tmp/data/fundamentals.json /tmp/fundamentals.json
          git config user.name "sahm-data"
          git config user.email "sahm-data@users.noreply.github.com"
          if git ls-remote --exit-code origin data >/dev/null; then
            git checkout -q -B data origin/data
          else
            git checkout -q --orphan data && git rm -rqf --cached . && rm -rf ./* .github
          fi
          OLD=$(python3 -c "import json;d=json.load(open('fundamentals.json'));d.pop('generatedAt',None);print(json.dumps(d,sort_keys=True))" 2>/dev/null || echo none)
          NEW=$(python3 -c "import json;d=json.load(open('/tmp/fundamentals.json'));d.pop('generatedAt',None);print(json.dumps(d,sort_keys=True))")
          if [ "$OLD" = "$NEW" ]; then echo "No changes"; echo "changed=no" >> $GITHUB_OUTPUT; exit 0; fi
          cp /tmp/fundamentals.json fundamentals.json
          git add fundamentals.json
          git commit -qm "Fundamentals $(date -u +%F)"
          git push -q origin data
          echo "changed=yes" >> $GITHUB_OUTPUT
      - name: Build a new APK with the data
        if: always() && steps.publish.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref main
      - name: Tell me if this failed
        # a notification on the same private channel as the alerts, so a breakage doesn't go unnoticed
        if: failure() && github.event_name == 'schedule'
        env:
          NTFY_ALERT_TOPIC: ${{ secrets.NTFY_ALERT_TOPIC }}
        run: |
          [ -n "$NTFY_ALERT_TOPIC" ] || exit 0
          curl -s -o /dev/null -H "Title: Sahm: balance-sheet update failed" -H "Tags: warning" -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "The balance-sheet update didn't finish. Tap to see which step failed. If it fails again tomorrow, PSX may have changed its website: see docs/maintenance.md." \
            "https://ntfy.sh/$NTFY_ALERT_TOPIC"
