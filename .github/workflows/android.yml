name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Bundle latest fundamentals
        run: |
          if git fetch -q origin data 2>/dev/null && git show origin/data:fundamentals.json > /tmp/f.json 2>/dev/null; then
            cp /tmp/f.json assets/fundamentals.json
            echo "Bundled fundamentals from the data branch"
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Parser, engine and indicator tests
        run: |
          npx tsx scripts/test-parsers.ts
          npx tsx scripts/test-engine.ts
          npx tsx scripts/test-indicators.ts
          npx tsx scripts/test-ratios.ts
          npx tsx scripts/test-ai.ts
          python3 scripts/fundamentals/test_extract.py

      - name: Live PSX check
        continue-on-error: true
        run: npx tsx scripts/smoke-live.ts

      - name: Stamp build number
        run: node -e "const f='app.json',a=require('./'+f);a.expo.android.versionCode=100+${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(a,null,2))"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_BUILD: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/release/app-release.apk Sahm-$VERSION-${{ github.run_number }}.apk
          ls -la *.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build.${{ github.run_number }}
          name: Sahm ${{ env.VERSION }} (build ${{ github.run_number }})
          make_latest: true
          body: ${{ github.event.head_commit.message || 'Sahm build' }}
          files: Sahm-*.apk
