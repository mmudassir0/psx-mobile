name: Android APK

on:
  push:
    branches: [main]
    # Only changes that end up inside the app; scripts, docs and other jobs are checked by tests.yml.
    paths:
      - 'src/**'
      - 'assets/**'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'tsconfig.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      # Most of the build is compiling C++ (llama.cpp, Skia, React Native libraries).
      # ccache reuses the compiled objects from earlier builds when the sources haven't changed.
      - name: Install ccache
        run: sudo apt-get install -y -qq ccache >/dev/null

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ hashFiles('package-lock.json') }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ hashFiles('package-lock.json') }}-
            ccache-

      - name: Bundle latest fundamentals
        run: |
          if git fetch -q origin data 2>/dev/null && git show origin/data:fundamentals.json > /tmp/f.json 2>/dev/null; then
            cp /tmp/f.json assets/fundamentals.json
            echo "Bundled fundamentals from the data branch"
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Parser, engine and indicator tests
        run: |
          npx tsx scripts/test-parsers.ts
          npx tsx scripts/test-engine.ts
          npx tsx scripts/test-indicators.ts
          npx tsx scripts/test-ratios.ts
          npx tsx scripts/test-ai.ts
          npx tsx scripts/test-backtest.ts
          npx tsx scripts/test-fair.ts
          npx tsx scripts/test-cache.ts
          npx tsx scripts/test-picks.ts
          npx tsx scripts/test-portfolio.ts
          npx tsx scripts/test-market.ts
          python3 scripts/fundamentals/test_extract.py

      - name: Live PSX check
        continue-on-error: true
        run: npx tsx scripts/smoke-live.ts

      - name: Stamp build number
        run: node -e "const f='app.json',a=require('./'+f);a.expo.android.versionCode=100+${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(a,null,2))"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install 2>&1 | tee /tmp/build.log

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_BUILD: ${{ github.run_number }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: |
          set -o pipefail
          ccache -z
          ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a 2>&1 | tee -a /tmp/build.log
          ccache -s | tee -a /tmp/build.log

      - name: Save the build log to the ci-logs branch on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs && grep -n -i -B2 -A8 "error\|failed\|what went wrong" /tmp/build.log | tail -400 > /tmp/logs/errors.txt || true
          tail -300 /tmp/build.log > /tmp/logs/tail.txt || true
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Build ${{ github.run_number }} failed"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/release/app-release.apk Sahm-$VERSION-${{ github.run_number }}.apk
          ls -la *.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build.${{ github.run_number }}
          name: Sahm ${{ env.VERSION }} (build ${{ github.run_number }})
          make_latest: true
          body: ${{ github.event.head_commit.message || 'Sahm build' }}
          files: Sahm-*.apk
