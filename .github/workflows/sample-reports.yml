# Temporary: fetches sample report PDFs so the extractor can be developed offline.
name: Sample reports
on:
  push:
    branches: [fundamentals-dev]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Find reports
        run: npx tsx scripts/fundamentals/find-reports.ts LUCK MEBL HBL OGDC HUBC EFERT SYS PPL > reports.json
      - name: Download latest of each kind
        run: |
          mkdir -p pdfs
          node -e '
          const r = require("./reports.json");
          const lines = [];
          for (const c of r) for (const kind of ["annual","quarterly","results"]) {
            const x = c.reports.find(p => p.kind === kind);
            if (x) lines.push(`${c.symbol}_${kind} ${x.url}`);
          }
          require("fs").writeFileSync("list.txt", lines.join("\n") + "\n");'
          while read name url; do
            curl -sSL --max-time 180 -A "Mozilla/5.0" -o "pdfs/$name.pdf" "$url" || echo "fail $name"
            sleep 1
          done < list.txt
          ls -la pdfs
      - name: Convert to text and push to a side branch
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p out
          cp reports.json out/
          for f in pdfs/*.pdf; do
            n=$(basename "$f" .pdf)
            pdfinfo "$f" > "out/$n.info.txt" 2>&1 || true
            pdftotext -layout "$f" "out/$n.txt" 2>/dev/null || echo "no text" > "out/$n.txt"
          done
          ls -la out
          git config user.name "sample-bot"
          git config user.email "sample-bot@users.noreply.github.com"
          git checkout --orphan fundamentals-samples
          git rm -rq --cached .
          git add out
          git commit -qm "Sample report text"
          git push -f origin fundamentals-samples
