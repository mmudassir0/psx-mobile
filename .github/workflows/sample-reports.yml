# Temporary: runs the extractor on sample companies and pushes the result to a side branch.
name: Sample reports
on:
  push:
    branches: [fundamentals-dev]
concurrency:
  group: sample
  cancel-in-progress: true
permissions:
  contents: write
  models: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
      - name: Find and extract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p /tmp/out
          (curl -sS -o /dev/null -w "curl company: %{http_code} %{time_total}s\n" -A "Mozilla/5.0" https://dps.psx.com.pk/company/LUCK;
           curl -sS -o /dev/null -w "curl indices: %{http_code} %{time_total}s\n" -A "Mozilla/5.0" https://dps.psx.com.pk/indices;
           curl -sS -o /tmp/out/model-probe.txt -w "model POST: %{http_code} redirect=%{redirect_url}\n" -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://models.github.ai/inference/chat/completions -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say hi"}]}';
           curl -sS -o /tmp/out/catalog.txt -w "catalog: %{http_code}\n" -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://models.github.ai/catalog/models;
           curl -sS -o /tmp/out/azure-probe.txt -w "azure POST: %{http_code}\n" -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" https://models.inference.ai.azure.com/chat/completions -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}]}';
           curl -sS -D /tmp/out/model-headers.txt -o /dev/null -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" https://models.github.ai/inference/chat/completions -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}]}';
           echo "token length: ${#GITHUB_TOKEN}";
           node -e 'fetch("https://dps.psx.com.pk/company/LUCK").then(r=>console.log("node fetch",r.status)).catch(e=>console.log("node fetch error",e.message,e.cause&&e.cause.code,e.cause&&e.cause.message))') > /tmp/out/diag.txt 2>&1 || true
          python3 scripts/fundamentals/trial.py /tmp/out/trial.json 2>&1 | tee /tmp/out/log.txt || true
          npx tsx scripts/fundamentals/find-reports.ts LUCK HUBC PPL EFERT > /tmp/out/reports.json || true
          python3 scripts/fundamentals/extract.py /tmp/out/reports.json /tmp/out/fundamentals.json 2>&1 | tee /tmp/out/extract-log.txt || true
      - name: Push result to a side branch
        if: always()
        run: |
          git config user.name "sample-bot"
          git config user.email "sample-bot@users.noreply.github.com"
          git checkout --orphan fundamentals-samples
          git rm -rqf --cached . || true
          rm -rf ./* || true
          cp -r /tmp/out ./out
          git add out
          git commit -qm "Extraction trial"
          git push -f origin fundamentals-samples
