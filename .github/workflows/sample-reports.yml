# Temporary: runs the extractor on sample companies and pushes the result to a side branch.
name: Sample reports
on:
  push:
    branches: [fundamentals-dev]
permissions:
  contents: write
  models: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
      - name: Find and extract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out
          npx tsx scripts/fundamentals/find-reports.ts LUCK MEBL HBL OGDC HUBC EFERT SYS PPL > /tmp/out/reports.json
          python3 scripts/fundamentals/extract.py /tmp/out/reports.json /tmp/out/fundamentals.json 2>&1 | tee /tmp/out/log.txt || true
      - name: Push result to a side branch
        if: always()
        run: |
          git config user.name "sample-bot"
          git config user.email "sample-bot@users.noreply.github.com"
          git checkout --orphan fundamentals-samples
          git rm -rqf --cached . || true
          rm -rf ./* || true
          cp -r /tmp/out ./out
          git add out
          git commit -qm "Extraction trial"
          git push -f origin fundamentals-samples
